<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Predictor Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cursor" id="cursor"></div>

    <div class="container">
        <div class="tile main-display">
            <h1 class="label-heading">Projected Wealth</h1>
            <div class="result" id="totalWealth">$0</div>
        </div>

        <div class="tile">
            <label>Current Net Worth ($)</label>
            <input type="number" id="principal" value="10000">
        </div>

        <div class="tile">
            <label>Monthly Contribution ($)</label>
            <input type="number" id="monthly" value="500">
        </div>

        <div class="tile">
            <label>Years to Grow</label>
            <input type="number" id="years" value="10">
        </div>

        <div class="tile">
            <label>Annual Return (%)</label>
            <input type="number" id="rate" value="7">
        </div>
    </div>

    <!-- Link to external JS -->
    <script src="script.js"></script>
</body>
</html>
